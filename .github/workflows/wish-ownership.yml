name: Wish ownership regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - run: php tests/WishOwnershipRegression.php
      - run: php -l src/api/wishes.php && php -l src/classes/wishthis/User.php
